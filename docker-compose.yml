
services:
  api:
    build: .
    command: uv run --no-sync api.py
    ports:
      - "5000:5000"

  frontend:
    build: .
    command: uv run --no-sync streamlit run app.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:5000
    depends_on:
      - api
